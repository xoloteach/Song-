<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime.js / Animation</title><style>html,body{height:100%;margin:0;background:#0b0a10;color:#f5dfd9;overflow:hidden;font:20px ui-monospace,monospace}.grid{position:fixed;inset:0;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:36px 36px}.star{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:400 min(42vw,450px) system-ui;color:#c87962;line-height:1;text-shadow:0 0 65px #b35a4866}.heading{position:absolute;top:60px;left:70px;letter-spacing:3px}#warning{position:absolute;bottom:40px;left:70px;color:#f6baa9;font-size:15px}</style></head><body><div class="grid"></div><div class="heading">ANIME.JS / SVG + DOM MOTION</div><div class="star" id="star">★</div><div id="warning"></div><script type="module">
try{const {animate}=await import('../node_modules/animejs/dist/bundles/anime.esm.min.js');
// In normal playback, Anime.js drives a DOM microinteraction; in offline exports renderFrameAt(t) is deterministic.
const star=document.querySelector('#star');const motion=animate(star,{opacity:[.7,1],duration:900,alternate:true,loop:true,ease:'inOutSine'});
window.renderFrameAt=t=>{motion.pause();star.style.opacity=String(.76+.24*(.5+.5*Math.sin(t*3)));star.style.transform=`translate(-50%,-50%) rotate(${t*30}deg) scale(${1+.12*Math.sin(t*6.283)} )`};
const qp=new URLSearchParams(location.search);if(qp.has('t'))window.renderFrameAt(Number(qp.get('t')));else{let start=performance.now();function loop(now){window.renderFrameAt((now-start)/1000);requestAnimationFrame(loop)}requestAnimationFrame(loop)}
}catch(e){document.querySelector('#warning').textContent='Anime.js unavailable: run npm install in tools/. '+e.message;console.error(e)}
</script></body></html>
