<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG / Vector Motion</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#08090e;overflow:hidden}svg{width:100%;height:100%;display:block}text{font-family:ui-monospace,monospace;fill:#f9e9e4}</style></head><body><svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#42343c" stroke-width="1"/></pattern></defs><rect width="1920" height="1080" fill="#0c0b11"/><rect width="1920" height="1080" fill="url(#grid)"/><g id="g"><path id="curve" stroke="#f2dcda" stroke-width="5" fill="none"/><path id="dashed" stroke="#c77561" stroke-width="2" stroke-dasharray="8 13" fill="none"/><circle id="dot" r="20" fill="#f7d6ce"/><circle id="dot2" r="11" fill="#c77561"/></g><text x="98" y="105" font-size="34" letter-spacing="6">SVG / BEZIER EDITOR</text><text id="clock" x="98" y="1000" font-size="34" fill="#e6b19c">00.00s</text></svg><script>
const el=id=>document.getElementById(id);let isAuto=!new URLSearchParams(location.search).has('t');
window.renderFrameAt=t=>{t=Number(t)||0;let bend=210*Math.sin(t*1.32),lift=90*Math.cos(t*.9),dx=130*Math.sin(t*.7);el('curve').setAttribute('d',`M320 730 C560 ${180+bend} 1240 ${920-bend} 1610 ${300+lift}`);el('dashed').setAttribute('d',`M320 730 L${530+dx} 240 M1380 920 L1610 ${300+lift}`);el('dot').setAttribute('cx',1610);el('dot').setAttribute('cy',300+lift);el('dot2').setAttribute('cx',320);el('dot2').setAttribute('cy',730);el('clock').textContent=t.toFixed(2)+'s'};
if(isAuto){let start=performance.now();function loop(now){window.renderFrameAt((now-start)/1000);requestAnimationFrame(loop)}requestAnimationFrame(loop)}else window.renderFrameAt(Number(new URLSearchParams(location.search).get('t')));
</script></body></html>
